name: Diag
on:
  push:
    branches: [diag-nul-device]
jobs:
  diag:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable-x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Let a container open the NUL device
        # Windows Server 2025 names no ALL APPLICATION PACKAGES entry on the device, so a container is
        # denied `NUL` and `git`, which opens it before it reads its arguments, never starts. The entry
        # is added the way an administrator would on a machine that wants `git` confined.
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;

          public static class NulDevice
          {
              [StructLayout(LayoutKind.Sequential)]
              struct Trustee
              {
                  public IntPtr Multiple;
                  public int MultipleOperation;
                  public int Form;
                  public int Type;
                  public IntPtr Name;
              }

              [StructLayout(LayoutKind.Sequential)]
              struct ExplicitAccess
              {
                  public uint Permissions;
                  public int Mode;
                  public uint Inheritance;
                  public Trustee Trustee;
              }

              [DllImport("advapi32.dll", CharSet = CharSet.Unicode)]
              static extern uint GetNamedSecurityInfoW(string name, int type, uint information,
                  IntPtr owner, IntPtr group, out IntPtr dacl, IntPtr sacl, out IntPtr descriptor);

              [DllImport("advapi32.dll")]
              static extern uint SetEntriesInAclW(uint count, ref ExplicitAccess entry, IntPtr old,
                  out IntPtr merged);

              [DllImport("advapi32.dll", CharSet = CharSet.Unicode)]
              static extern uint SetNamedSecurityInfoW(string name, int type, uint information,
                  IntPtr owner, IntPtr group, IntPtr dacl, IntPtr sacl);

              [DllImport("advapi32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              static extern bool ConvertStringSidToSidW(string text, out IntPtr sid);

              static void Check(uint code)
              {
                  if (code != 0) throw new Win32Exception((int)code);
              }

              public static void Allow()
              {
                  const string device = @"\\.\NUL";
                  const int FileObject = 1;
                  const uint DaclInformation = 4;
                  const uint GenericRead = 0x80000000;
                  const uint GenericWrite = 0x40000000;
                  IntPtr dacl, descriptor, sid, merged;
                  Check(GetNamedSecurityInfoW(device, FileObject, DaclInformation, IntPtr.Zero,
                      IntPtr.Zero, out dacl, IntPtr.Zero, out descriptor));
                  if (!ConvertStringSidToSidW("S-1-15-2-1", out sid))
                      throw new Win32Exception(Marshal.GetLastWin32Error());
                  var entry = new ExplicitAccess
                  {
                      Permissions = GenericRead | GenericWrite,
                      Mode = 1,
                      Inheritance = 0,
                      Trustee = new Trustee { Form = 0, Type = 2, Name = sid },
                  };
                  Check(SetEntriesInAclW(1, ref entry, dacl, out merged));
                  Check(SetNamedSecurityInfoW(device, FileObject, DaclInformation, IntPtr.Zero,
                      IntPtr.Zero, merged, IntPtr.Zero));
              }
          }
          '@
          [NulDevice]::Allow()
      - run: BRAVEBOT_ALLOW_UNCONFIGURED_BUILD=1 cargo test -p bravebot-sandbox --locked --test windows -- --include-ignored git_starts
