name: scratch-build-install
on:
  push:
    branches: [us298-scratch-build]
permissions:
  contents: read
  actions: read
jobs:
  windows-installers:
    name: Windows installers
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-helpers-*
          merge-multiple: true
          path: dist
          run-id: 36139887684
          github-token: ${{ github.token }}
      - name: Build the installers
        run: make app-release-windows
      - name: Build an older installer of each
        run: |
          npm --prefix ui pkg set version=0.0.1
          for pair in amd64:x64 arm64:arm64; do
            node ui/scripts/windows-installer.mjs --bundle="ui/dist/Brave Bot-win32-${pair#*:}" \
              --arch="${pair%%:*}" --out=dist/previous
          done
          git checkout -- ui/package.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-amd64
          path: |
            dist/bravebot-desktop-windows-amd64-setup.exe
            dist/previous/bravebot-desktop-windows-amd64-setup.exe
            ui/dist/Brave Bot-win32-x64/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-arm64
          path: |
            dist/bravebot-desktop-windows-arm64-setup.exe
            dist/previous/bravebot-desktop-windows-arm64-setup.exe
            ui/dist/Brave Bot-win32-arm64/
          if-no-files-found: error
          retention-days: 1

  windows-install:
    name: Install on Windows (${{ matrix.arch }})
    needs: windows-installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer-${{ matrix.arch }}
      - name: Install, start, upgrade and uninstall
        timeout-minutes: 30
        run: node ui/scripts/check-windows-install.mjs --arch=${{ matrix.arch }}
      - name: What is installed
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "$env:LOCALAPPDATA\Programs\bravebot-desktop" -ErrorAction SilentlyContinue | Select-Object FullName, Length | Out-String -Width 300
