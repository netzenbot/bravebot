name: scratch-install
on:
  push:
    branches: [us298-scratch-install]
permissions:
  contents: read
  actions: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer-${{ matrix.arch }}
          run-id: 36139887684
          github-token: ${{ github.token }}
      - name: Node
        run: node -p "process.arch + ' ' + process.version"
      - name: Install, start, upgrade and uninstall
        timeout-minutes: 30
        run: node ui/scripts/check-windows-install.mjs --arch=${{ matrix.arch }}
      - name: What is installed
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA\Programs\bravebot-desktop" -ErrorAction SilentlyContinue | Select-Object Name, Length | Out-String -Width 300
          powershell.exe -NoProfile -NonInteractive -Command "`$PSVersionTable.PSVersion; [Environment]::Is64BitProcess; `$env:PROCESSOR_ARCHITECTURE"
